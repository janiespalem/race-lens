name: CI

on:
  push:
    branches: [main, "capture/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev,api,tui]"
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q
          python tests/tui_check.py
      - name: Lint
        if: matrix.python-version == '3.12'
        run: |
          cd backend
          ruff check racelens/ scripts/ tests/
      - name: Validate recorder publication
        if: matrix.python-version == '3.12' && startsWith(github.ref, 'refs/heads/capture/')
        run: |
          git fetch origin main
          cd backend
          python ../deploy/recorder/verify_capture.py

  rust:
    name: Rust race-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Test race-core
        run: |
          cd rust/race-core
          cargo test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build
          npm run lint
          for script in scripts/check-*.ts; do
            node "$script"
          done

  android:
    name: Android (Pocket, Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile and test Pocket
        run: |
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
