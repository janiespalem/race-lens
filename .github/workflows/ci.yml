name: CI

on:
  push:
    branches: [main, "capture/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev,api,storage,tui]"
          pip freeze | grep -v '^-e ' > "$RUNNER_TEMP/racelens-requirements.txt"
          pip install --dry-run --ignore-installed \
            --report "$RUNNER_TEMP/racelens-recorder-report.json" \
            ".[recorder,storage]"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((temp / "racelens-recorder-report.json").read_text())
          pins = sorted(
              {
                  f"{metadata['name']}=={metadata['version']}"
                  for item in report["install"]
                  if (metadata := item["metadata"])["name"] != "racelens"
              }
          )
          (temp / "racelens-recorder-requirements.txt").write_text(
              "\n".join(pins) + "\n"
          )
          PY
          pip install pip-audit==2.10.1
      - name: Audit Python dependencies
        run: |
          pip-audit --requirement "$RUNNER_TEMP/racelens-requirements.txt" --no-deps
          # signalrcore 1.0.2 (latest) pins msgpack==1.1.2 exactly. Keep the
          # recorder graph visible while containing the upstream exception.
          pip-audit \
            --requirement "$RUNNER_TEMP/racelens-recorder-requirements.txt" \
            --no-deps \
            --ignore-vuln PYSEC-2026-3625
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q
          python tests/tui_check.py
      - name: Lint
        if: matrix.python-version == '3.12'
        run: |
          cd backend
          ruff check racelens/ scripts/ tests/
      - name: Validate recorder publication
        if: matrix.python-version == '3.12' && startsWith(github.ref, 'refs/heads/capture/')
        run: |
          git fetch origin main
          cd backend
          python ../deploy/recorder/verify_capture.py

  rust:
    name: Rust race-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Test race-core
        run: |
          cd rust/race-core
          cargo test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high
          npm run build
          npm run lint
          for script in scripts/check-*.ts; do
            node "$script"
          done

  android:
    name: Android (Pocket, Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile and test Pocket
        run: |
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
