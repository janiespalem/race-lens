name: Publish recording

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'capture/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trusted diff boundary
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin "$SHA"
          git merge-base --is-ancestor origin/main "$SHA"
          test "$(git rev-list --count origin/main.."$SHA")" = 1
          python deploy/recorder/verify_capture.py --head "$SHA" --paths-only
      - name: Publish through data PR
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPOSITORY" --base main --head "$BRANCH" \
            --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            url=$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" \
              --title "data(${BRANCH#capture/}): publish recorded session" \
              --body "Validated recorder publication. Merged automatically after CI.")
            pr=${url##*/}
          fi
          gh pr merge --repo "$REPOSITORY" --rebase --match-head-commit "$SHA" "$pr"
