name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify desktop release metadata
        run: npm run check:desktop
        working-directory: frontend
        env:
          DESKTOP_RELEASE_VERSION: ${{ github.ref_name }}
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_name }}
          releaseName: Race Lens ${{ github.ref_name }}
          releaseBody: Unsigned Windows x64 installer. Windows SmartScreen may show a warning.
          releaseDraft: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
